  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <button class="brand" data-view="shop" aria-label="Scout home"><svg class="brand-mark"><use href="#i-spark"/></svg><span>scout<span class="brand-period">.</span></span></button>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="shop">Shopping</button>
      <button class="nav-item" data-view="catalog">Catalog</button>
      <button class="nav-item" data-view="memory">Memory <span id="memory-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="architecture">Architecture</button>

  </header>
  <main id="content" tabindex="-1"><div class="loading-card"><span class="spinner"></span><p>Getting your workspace ready…</p></div></main>
  <footer class="app-footer"><span class="footer-brand">scout. <span>Good finds. Clear minds.</span></span><span>Project 1 · Sample CSV · Simulated purchases</span><button class="subtle-link" id="footer-architecture">Every step, in the open <svg><use href="#i-arrow"/></svg></button></footer>
